[package]
name = "mem-eff"
version = "0.1.0"
edition = "2021"

[dependencies]
ctrlc = "3.5.2"
reqwest = { version = "0.12.28", features = ["blocking", "json", "rustls-tls"], default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
faster-hex = "1.0.0"
serde = { version = "1.0.229", features = ["derive"] }
itoa = "1.0.15"
sha1 = "0.10.7" # newer versions are slower
