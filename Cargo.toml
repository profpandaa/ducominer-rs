[package]
name = "mem-eff"
version = "0.1.0"
edition = "2024"

[dependencies]
ctrlc = "3.5.2"
reqwest = { version = "0.12.28", features = ["blocking", "json", "rustls-tls"], default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
faster-hex = "1.0.0"
serde = { version = "1.0.229", features = ["derive"] }
sha1 = { version = "0.10.7", features = ["compress"]} # newer versions are slower

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"